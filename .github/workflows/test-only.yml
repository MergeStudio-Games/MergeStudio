name: Feature tests
on:
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}
          restore-keys: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-
      - name: Check Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" -a -n "$UNITY_EMAIL" -a -n "$UNITY_PASSWORD" || {
            echo 'UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD repository secrets are required for GameCI.'
            exit 1
          }
      - uses: game-ci/unity-test-runner@v4
        with:
          cliVersion: v0.1.65
          unityVersion: auto
          testMode: all
          artifactsPath: TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ github.job }}
          path: TestResults
          if-no-files-found: warn

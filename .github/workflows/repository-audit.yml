name: Repository audit

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Validate JSON and Unity version
        shell: bash
        run: |
          python3 -m json.tool Packages/manifest.json >/dev/null
          grep -q '^m_EditorVersion: 6000\.6\.0f1$' ProjectSettings/ProjectVersion.txt

      - name: Run repository audit
        run: python3 Tools/validate_repo.py

      - name: Check for forbidden generated or secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(Library|Temp|Obj|Build|Builds|Logs|TestResults|ServerData)/|\.(aab|apk|ipa|keystore|jks|p12)$'; then
            echo 'Generated output or signing material is tracked.'
            exit 1
          fi


name: Build Android
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Android Unity tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}
          restore-keys: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-
      - name: Check Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" -a -n "$UNITY_EMAIL" -a -n "$UNITY_PASSWORD" || {
            echo 'UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD repository secrets are required for GameCI.'
            exit 1
          }
      - uses: game-ci/unity-test-runner@v4
        with:
          cliVersion: v0.1.65
          unityVersion: auto
          testMode: all
          artifactsPath: TestResults
      - name: Verify both Unity suites
        run: python3 Tools/verify_unity_results.py TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          retention-days: 14
          name: tests-${{ github.job }}
          path: TestResults
          if-no-files-found: warn
  build:
    timeout-minutes: 90
    needs: tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-Android-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}
          restore-keys: Library-${{ runner.os }}-Android-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-
      - name: Check Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" -a -n "$UNITY_EMAIL" -a -n "$UNITY_PASSWORD" || {
            echo 'UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD repository secrets are required for GameCI.'
            exit 1
          }
      - uses: game-ci/unity-builder@v6
        with:
          cliVersion: v0.1.65
          unityVersion: auto
          targetPlatform: Android
          buildName: MergeStudio
          allowDirtyBuild: true
          # Explicit AAB output; the pinned builder accepts androidExportType.
          androidExportType: androidAppBundle
      - name: Verify Android App Bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'Tools')
          from release_manifest import manifest
          bundles = list(Path('build').rglob('*.aab'))
          if not bundles:
              raise SystemExit('Build did not produce an Android App Bundle')
          for bundle in bundles:
              manifest(bundle, Path(str(bundle) + '.json'))
              print(f'Verified {bundle}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Android-build
          retention-days: 30
          path: |
            build/**/*.aab
            build/**/*.aab.json
          if-no-files-found: error

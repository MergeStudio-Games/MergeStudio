name: Build iOS
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}
          restore-keys: Library-${{ runner.os }}-Tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-
      - name: Check Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" -a -n "$UNITY_EMAIL" -a -n "$UNITY_PASSWORD" || {
            echo 'UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD repository secrets are required for GameCI.'
            exit 1
          }
      - uses: game-ci/unity-test-runner@v4
        with:
          cliVersion: v0.1.65
          unityVersion: auto
          testMode: all
          artifactsPath: TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ github.job }}
          path: TestResults
          if-no-files-found: warn
  build:
    needs: tests
    runs-on: macos-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-iOS-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-${{ github.sha }}
          restore-keys: Library-${{ runner.os }}-iOS-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}-
      - name: Check Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" -a -n "$UNITY_EMAIL" -a -n "$UNITY_PASSWORD" || {
            echo 'UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD repository secrets are required for GameCI.'
            exit 1
          }
      - uses: game-ci/unity-builder@v4
        with:
          cliVersion: v0.1.65
          unityVersion: auto
          targetPlatform: iOS
          buildName: MergeStudio
          allowDirtyBuild: true
          # Xcode archive/export and IPA signing require Apple certificates,
          # provisioning profile, team ID and export options from repository secrets.
          # This workflow deliberately delivers the unsigned Xcode project.
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-build
          path: build
          if-no-files-found: error
